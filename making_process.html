<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산대 AI Creative Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 애니메이션 정의 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        /* 스크롤바 숨김 (필요시) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body.modal-open {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 min-h-screen">

    <!-- App Container -->
    <div id="app"></div>

    <script>
        // --- 데이터 정의 ---
        const processSteps1 = [
            { id: 1, title: "데이터 수집·분석", sub: "부산대 데이터", desc: "에브리타임, 기사 등에서 키워드를 추출하여 트렌드를 분석합니다.", logoName: "PNU Data", logoPath: "img/logo1.jpg", toolCategory: "BIG DATA", gradient: "from-blue-600 to-blue-400", icon: "database" },
            { id: 2, title: "스토리북 제작", sub: "Gemini AI", desc: "분석된 데이터를 기반으로 흥미로운 스토리라인과 텍스트를 생성합니다.", logoName: "Gemini", logoPath: "img/logo2.jpg", toolCategory: "LLM AI", gradient: "from-indigo-600 to-violet-500", icon: "book-open" },
            { id: 3, title: "영상 소스 변환", sub: "Grok (6초 영상)", desc: "스토리북의 핵심 이미지를 6초 길이의 생동감 있는 영상으로 변환합니다.", logoName: "Grok", logoPath: "img/logo3.png", toolCategory: "VISION AI", gradient: "from-slate-800 to-slate-600", icon: "video" },
            { id: 4, title: "대본 작성", sub: "Gemini Narration", desc: "영상 길이에 맞춰 자연스러운 나레이션 대본을 최적화하여 작성합니다.", logoName: "Gemini", logoPath: "img/logo4.jpg", toolCategory: "LLM AI", gradient: "from-violet-600 to-fuchsia-500", icon: "mic" },
            { id: 5, title: "BGM 작곡", sub: "SUNO AI", desc: "대본의 감정과 분위기를 분석해 딱 맞는 배경음악을 생성합니다.", logoName: "SUNO", logoPath: "img/logo5.png", toolCategory: "AUDIO AI", gradient: "from-pink-600 to-rose-500", icon: "music" },
            { id: 6, title: "숏츠 완성", sub: "Vrew Editing", desc: "영상, 자막, 오디오를 통합하여 최종 숏폼 콘텐츠를 발행합니다.", logoName: "Vrew", logoPath: "img/logo6.png", toolCategory: "EDITING AI", gradient: "from-orange-500 to-amber-500", icon: "film" }
        ];

        const content2Steps = [
            {
                title: "사용자 얼굴 업로드",
                icon: "camera",
                content: "사용자의 사진을 업로드하면 AI가 얼굴 특징(눈, 코, 입 등)을 정밀 분석하여 캐릭터화 준비를 마칩니다.",
                tag: "Input",
                imgSrc: "img/step1.png",
                imgDesc: "사용자 사진 분석 및 특징 추출"
            },
            {
                title: "주인공 페르소나 합성",
                icon: "wand-2",
                content: "업로드된 얼굴이 생성된 스토리 속 주인공 캐릭터(80년대 대학생 등)의 얼굴로 자연스럽게 변환되어 몰입감을 극대화합니다.",
                tag: "Processing",
                imgSrc: "img/step2.png",
                imgDesc: "80년대 스타일로 페르소나 변환"
            },
            {
                title: "인터랙티브 스토리 선택",
                icon: "box",
                content: "AI가 생성한 상황(예: '시위대와 마주쳤다')에서 사용자가 다음 행동을 선택하면, 그에 맞춰 새로운 이미지와 스토리가 전개됩니다.",
                tag: "Interaction",
                imgSrc: "img/step3.png",
                imgDesc: "선택지에 따른 스토리 분기"
            },
            {
                title: "웹툰 & 숏츠 통합 제작",
                icon: "film",
                content: "사용자가 선택해온 스토리 라인을 엮어 한 편의 '웹툰'으로 구성하고, 동시에 생동감 넘치는 '숏폼 영상'으로 렌더링합니다.",
                tag: "Output",
                imgSrc: "img/step4.png",
                imgDesc: "최종 결과물 자동 생성"
            }
        ];

        // --- 상태 관리 ---
        let state = {
            activeModal: null // 'content1', 'content2', or null
        };

        // --- 컴포넌트 헬퍼 함수 ---

        // 로고 플레이스홀더 (이미지 처리 포함)
        function LogoPlaceholder(name, src, color, size = "md") {
            const sizeClasses = size === "sm" ? "w-10 h-10" : "w-14 h-14";
            const textClasses = size === "sm" ? "text-[6px]" : "text-[8px]";

            // 이미지가 로드되지 않을 경우를 대비한 텍스트 폴백은 JS로 처리하기 복잡하므로
            // 간단히 이미지 태그에 onerror 핸들러를 인라인으로 추가하거나
            // 여기서는 이미지가 있다고 가정하고 구조를 만듭니다.
            const imgTag = `<img src="${src}" alt="${name}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`;
            const fallback = `
                <div class="w-full h-full flex flex-col items-center justify-center hidden bg-inherit text-center">
                    <span class="${textClasses} font-bold text-white/90 uppercase tracking-widest mb-0.5">AI Tool</span>
                    <span class="font-black text-xs text-white px-1 drop-shadow-md leading-tight">${name}</span>
                </div>
            `;

            return `
                <div class="${sizeClasses} ${color} backdrop-blur-md rounded-2xl flex flex-col items-center justify-center border border-white/40 shadow-lg shrink-0 transition-transform duration-300 group-hover:scale-110 overflow-hidden relative">
                    ${src ? imgTag + fallback : fallback.replace('hidden', 'flex')}
                </div>
            `;
        }

        // --- 렌더링 함수 ---

        function renderDashboard() {
            return `
                <!-- RE-PNU Navbar -->
                <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
                    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='RE_PNU_Data_Journey.html'">
                            <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20 hover:scale-105 transition-transform">
                                <span class="text-white font-black text-lg">R</span>
                            </div>
                            <span class="font-black text-xl tracking-tighter text-slate-900">RE-PNU</span>
                        </div>
                    </div>
                </nav>

                <div class="max-w-6xl mx-auto py-10 space-y-8 px-4">
                    <header class="text-center mb-10">
                        <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold mb-3 border border-indigo-200">
                            <i data-lucide="sparkles" class="w-3 h-3"></i> PNU AI CREATIVE STUDIO
                        </div>
                        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight">Project Dashboard</h1>
                        <p class="text-slate-500 mt-2">부산대학교 AI 콘텐츠 제작 및 체험 플랫폼</p>
                    </header>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Content 1 Card -->
                        <div class="group bg-white rounded-3xl p-8 shadow-xl border border-slate-200 flex flex-col relative overflow-hidden hover:shadow-2xl transition-all duration-300">
                            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>
                            <div class="mb-6">
                                <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mb-4 text-blue-600 group-hover:scale-110 transition-transform duration-300">
                                    <i data-lucide="database" class="w-7 h-7"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-slate-900 mb-3 leading-tight">
                                    부산대 데이터를 통해 경험하는<br/>
                                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">부산의 과거, 현재, 미래</span>
                                </h2>
                                <div class="w-12 h-1 bg-slate-100 mb-4 rounded-full"></div>
                                <p class="text-slate-600 text-sm leading-relaxed mb-4">
                                    부산대의 방대한 데이터를 AI로 분석하여 독창적인 <strong>스토리북</strong>과 <strong>숏폼 영상</strong>을 제작합니다.
                                </p>
                            </div>
                            <button onclick="openModal('content1')" class="mt-auto w-full py-3.5 bg-slate-900 text-white rounded-xl font-bold hover:bg-blue-600 transition-colors shadow-lg flex items-center justify-center gap-2">
                                제작 과정 보기 <i data-lucide="maximize-2" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Content 2 Card -->
                        <div class="group bg-white rounded-3xl p-8 shadow-xl border border-slate-200 flex flex-col relative overflow-hidden hover:shadow-2xl transition-all duration-300">
                            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                            <div class="mb-6">
                                <div class="w-14 h-14 bg-purple-50 rounded-2xl flex items-center justify-center mb-4 text-purple-600 group-hover:scale-110 transition-transform duration-300">
                                    <i data-lucide="user" class="w-7 h-7"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-slate-900 mb-3 leading-tight">
                                    사용자가 직접 그리는 부산대:<br/>
                                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600">시대상의 주인공이 되다</span>
                                </h2>
                                <div class="w-12 h-1 bg-slate-100 mb-4 rounded-full"></div>
                                <p class="text-slate-600 text-sm leading-relaxed mb-4">
                                    사용자의 얼굴을 합성하여 <strong>부산대의 역사적 순간</strong> 속 주인공이 되어보세요. 웹툰과 숏츠로 나만의 이야기를 만듭니다.
                                </p>
                            </div>
                            <button onclick="openModal('content2')" class="mt-auto w-full py-3.5 bg-white border-2 border-slate-900 text-slate-900 rounded-xl font-bold hover:bg-slate-50 transition-colors shadow-lg flex items-center justify-center gap-2">
                                체험 및 프로세스 보기 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderModalContent1() {
            const stepsHtml = processSteps1.map(step => `
                <div class="group relative bg-white rounded-3xl border border-slate-200 shadow-2xl overflow-hidden hover:border-indigo-300 transition-all duration-300 hover:-translate-y-2">
                    <div class="h-40 bg-gradient-to-br ${step.gradient} p-6 relative flex flex-col items-center justify-center text-center overflow-hidden">
                        <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/20 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
                        <div class="absolute top-4 left-4 bg-white/20 backdrop-blur-sm px-2.5 py-1 rounded-lg border border-white/30 shadow-sm z-10">
                            <span class="text-[10px] font-bold text-white tracking-widest">STEP 0${step.id}</span>
                        </div>
                        <div class="z-10 flex flex-col items-center gap-3">
                            ${LogoPlaceholder(step.logoName, step.logoPath, "bg-white/20")}
                            <div class="flex flex-col items-center">
                                <h3 class="text-2xl font-black text-white tracking-tight drop-shadow-lg flex items-center gap-1.5">
                                    ${step.logoName} <i data-lucide="sparkles" class="w-4 h-4 text-yellow-300 fill-yellow-300"></i>
                                </h3>
                                <span class="text-[10px] font-bold text-white/90 tracking-[0.2em] bg-black/10 px-2 py-0.5 rounded-full mt-1 border border-white/20">
                                    ${step.toolCategory}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="p-6 h-[150px] flex flex-col bg-white relative">
                        <div class="text-center mb-3">
                            <h4 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors">${step.title}</h4>
                        </div>
                        <p class="text-slate-600 text-sm leading-relaxed text-center line-clamp-3">${step.desc}</p>
                        <div class="mt-auto w-full bg-slate-100 h-1 rounded-full overflow-hidden mt-4">
                            <div class="h-full bg-gradient-to-r ${step.gradient} w-full opacity-40 group-hover:opacity-100 transition-opacity duration-500"></div>
                        </div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="fixed inset-0 z-50 bg-slate-50/95 backdrop-blur-md animate-fade-in flex flex-col">
                    <div class="flex justify-between items-center px-6 md:px-8 py-5 border-b border-slate-200 bg-white/80 shrink-0">
                        <div>
                            <h2 class="text-xl md:text-2xl font-bold text-slate-900 flex items-center gap-3">
                                AI Pipeline Overview
                                <span class="hidden md:inline-flex px-2 py-0.5 rounded text-xs font-medium bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-sm">
                                    <i data-lucide="cpu" class="w-3 h-3 mr-1"></i> AI Powered
                                </span>
                            </h2>
                        </div>
                        <button onclick="closeModal()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 hover:text-slate-900 transition-colors">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-4 md:p-8">
                        <div class="max-w-7xl mx-auto h-full flex flex-col justify-center min-h-min">
                            <div class="text-center mb-8 md:mb-12">
                                <h3 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">Smart Content Creation</h3>
                                <p class="text-slate-500">각 단계별로 활용된 <span class="text-blue-600 font-bold">핵심 AI 도구</span>를 확인하세요</p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                                ${stepsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderModalContent2() {
            // features section items
            const features = [
                { icon: "theater", title: "생생한 시간 여행", desc: "사용자의 얼굴을 합성하여 생생한 몰입감을 선사합니다.", bg: "bg-indigo-50 border-indigo-100" },
                { icon: "pencil", title: "내가 만드는 이야기", desc: "직접 선택하는 스토리로 나만의 콘텐츠를 창작합니다.", bg: "bg-purple-50 border-purple-100" },
                { icon: "sparkles", title: "고퀄리티 AI 콘텐츠", desc: "전문 웹툰과 숏폼 영상을 즉시 생성합니다.", bg: "bg-blue-50 border-blue-100" }
            ];

            const featuresHtml = features.map(feat => `
                <div class="${feat.bg} rounded-2xl p-8 text-center border">
                    <div class="flex justify-center mb-4 text-4xl">
                        <i data-lucide="${feat.icon}" class="w-10 h-10 stroke-[1.5]"></i>
                    </div>
                    <h4 class="text-xl font-bold text-slate-900 mb-2">${feat.title}</h4>
                    <p class="text-slate-600 text-sm">${feat.desc}</p>
                </div>
            `).join('');

            const stepsHtml = content2Steps.map((step, idx) => {
                const isEven = idx % 2 === 0;
                // 레이아웃 방향 결정 (왼쪽/오른쪽 교차)
                const textColClass = isEven ? 'md:mr-auto md:text-right md:pr-10' : 'md:order-2 md:ml-auto md:text-left md:pl-10';
                const imgColClass = isEven ? 'md:order-1 md:ml-auto md:pl-0' : 'md:order-1 md:mr-auto md:pr-12 md:pl-0';

                const textWrapperClass = `w-full md:w-1/2 md:pr-12 md:text-right ${idx % 2 !== 0 ? 'md:order-2 md:pl-12 md:pr-0 md:text-left' : ''}`;
                const imgWrapperClass = `w-full md:w-1/2 md:pl-12 mt-6 md:mt-0 ${idx % 2 !== 0 ? 'md:order-1 md:pr-12 md:pl-0' : ''}`;

                return `
                    <div class="relative flex flex-col md:flex-row items-center group">

                        <!-- Middle Icon -->
                        <div class="absolute top-0 md:top-1/2 left-1/2 transform -translate-x-1/2 md:-translate-y-1/2 w-12 h-12 rounded-full bg-white border-4 border-indigo-500 z-20 flex items-center justify-center text-indigo-600 shadow-lg group-hover:scale-110 transition-transform duration-300 mb-6 md:mb-0">
                            <i data-lucide="${step.icon}" class="w-6 h-6"></i>
                        </div>

                        <!-- Text Side -->
                        <div class="${textWrapperClass}">
                            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 group-hover:border-indigo-500 transition-all duration-300 h-full flex flex-col justify-center">
                                <div>
                                    <span class="inline-block px-3 py-1 mb-3 text-xs font-bold tracking-wider uppercase rounded-full bg-indigo-50 text-indigo-600">
                                        ${step.tag}
                                    </span>
                                    <h3 class="text-xl font-bold text-slate-900 mb-2">${step.title}</h3>
                                    <p class="text-slate-600 leading-relaxed text-sm">
                                        ${step.content}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Image Side -->
                        <div class="${imgWrapperClass}">
                            <div class="rounded-xl overflow-hidden shadow-lg border border-slate-200 group-hover:shadow-xl transition-shadow relative aspect-video bg-slate-200">
                                <div class="absolute top-3 left-3 bg-black/50 backdrop-blur-sm text-white text-xs px-2 py-1 rounded font-bold z-10">
                                    결과 예시
                                </div>
                                <img
                                    src="${step.imgSrc}"
                                    alt="${step.title}"
                                    class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500"
                                    onerror="this.src='https://placehold.co/600x400/cbd5e1/475569?text=Step+${idx+1}'"
                                />
                                <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/70 to-transparent p-4">
                                    <p class="text-white text-sm font-medium">${step.imgDesc}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="fixed inset-0 z-50 bg-slate-50 flex flex-col animate-fade-in overflow-hidden">
                    <!-- Header -->
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-indigo-100 rounded-lg">
                                <i data-lucide="user" class="w-6 h-6 text-indigo-700"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold text-indigo-900 tracking-tight">부산대 AI Creative Studio</h1>
                                <p class="text-xs text-slate-500 hidden md:block">Google AI Studio 활용: 효원의 역사와 시대를 그리는 웹툰 & 숏츠</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-medium transition-colors text-sm">
                            <i data-lucide="home" class="w-4 h-4"></i> 메인으로
                        </button>
                    </header>

                    <main class="flex-1 overflow-y-auto bg-slate-50 p-6">
                        <div class="max-w-7xl mx-auto pb-10">
                            <div class="animate-fade-in-up">

        // --- 로직 컨트롤 ---

        function render() {
            const app = document.getElementById('app');
            let html = '';

            // 기본 대시보드는 항상 렌더링하고, 모달은 오버레이로 처리하거나
            // 여기서는 화면 자체를 갈아끼우는 방식으로 구현합니다 (SPA 느낌).
            // 하지만 모달 효과를 위해 대시보드 위에 오버레이를 얹는 구조가 좋습니다.

            // 1. 대시보드 렌더링
            html += renderDashboard();

            // 2. 모달 렌더링 (있다면)
            if (state.activeModal === 'content1') {
                html += renderModalContent1();
                document.body.classList.add('modal-open');
            } else if (state.activeModal === 'content2') {
                html += renderModalContent2();
                document.body.classList.add('modal-open');
            } else {
                document.body.classList.remove('modal-open');
            }

            app.innerHTML = html;

            // 아이콘 갱신 (Lucide)
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // 전역 함수로 노출 (onclick 핸들러용)
        window.openModal = function(modalType) {
            state.activeModal = modalType;
            render();
            // 화면 상단으로 스크롤 이동
            if(modalType) window.scrollTo(0,0);
        };

        window.closeModal = function() {
            state.activeModal = null;
            render();
        };

        // 초기 렌더링
        render();

    </script>
