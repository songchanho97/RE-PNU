<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE-PNU: AI Creative Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#020617', // Home.html dark bg
                            card: '#1e293b',
                            text: '#f8fafc'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FDFBF7; /* Home.html light bg */
            color: #1a202c;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Dark Mode Global Overrides */
        html.dark body { background-color: #020617; color: #f8fafc; }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Card Styles derived from Home.html */
        .pnu-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .dark .pnu-card {
            background: #1e293b;
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.3);
        }
        .pnu-card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px -10px rgba(0,0,0,0.15); }

        .glow-text { text-shadow: 0 0 30px rgba(79, 70, 229, 0.3); }

        /* Chart Container */
        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        /* Toggle Button Icon Animation */
        .toggle-icon { transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        html.dark .toggle-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="antialiased">

    <nav class="w-full bg-white/50 backdrop-blur-md border-b border-gray-200 fixed top-0 z-50 transition-colors duration-300 dark:bg-slate-900/50 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-6 md:px-8 flex justify-between items-center h-20">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='home.html'">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <span class="text-white font-black text-xl">R</span>
                </div>
                <span class="font-black text-2xl tracking-tighter text-slate-900 dark:text-white">RE-PNU <span class="text-indigo-600 font-medium text-lg ml-1">Studio</span></span>
            </div>
            <div class="flex items-center gap-4 md:gap-8">
                <button onclick="app.reset()" class="hidden md:block text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-white transition-colors">
                    Dashboard
                </button>
                <button onclick="app.toggleTheme()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-slate-700 transition-all group">
                    <div class="toggle-icon relative w-5 h-5">
                        <span id="theme-icon-sun" class="absolute inset-0 flex items-center justify-center opacity-100 dark:opacity-0 transition-opacity">☀️</span>
                        <span id="theme-icon-moon" class="absolute inset-0 flex items-center justify-center opacity-0 dark:opacity-100 transition-opacity">🌙</span>
                    </div>
                </button>
            </div>
        </div>
    </nav>

    <div class="pt-32 pb-20 min-h-screen flex flex-col items-center">

        <header class="text-center mb-16 px-4 fade-in">
            <p class="text-lg md:text-xl text-slate-500 dark:text-slate-400 max-w-2xl mx-auto font-light leading-relaxed">
                데이터로 분석된 <span class="text-indigo-600 dark:text-indigo-400 font-bold">시대정신</span>을 프롬프트로 변환하여,<br>
                과거와 현재가 공존하는 시네마틱 콘텐츠를 생성합니다.
            </p>
        </header>

        <div class="w-full max-w-5xl px-6 mb-12 fade-in" style="animation-delay: 0.1s;">
            <div class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-2 rounded-2xl shadow-lg border border-gray-200 dark:border-slate-700 flex flex-wrap md:flex-nowrap justify-between gap-2" id="nav-container">
                </div>
        </div>

        <main class="w-full max-w-7xl px-6 fade-in" style="animation-delay: 0.2s;" id="main-content">
            </main>
    </div>

    <footer class="w-full bg-white dark:bg-slate-900 border-t border-gray-200 dark:border-slate-800 py-12 text-center transition-colors">
        <div class="max-w-7xl mx-auto px-6">
            <p class="font-black text-lg text-slate-900 dark:text-slate-200 mb-2 uppercase tracking-tight">RE-PNU AI Studio</p>
            <p class="text-sm text-slate-500 dark:text-slate-500">&copy; 2024 Team PNU Data Analytics. Powered by Google Gemini & Imagen.</p>
        </div>
    </footer>

    <script>
        // --- Data Store (Content) ---
        const appData = {
            phases: [
                { id: 'overview', title: '🗺️ 전체 로드맵', label: 'Overview' },
                { id: 'phase1', title: '1️⃣ 데이터 수집', label: 'Data Prep' },
                { id: 'phase2', title: '2️⃣ 시대상 분석', label: 'Analysis' },
                { id: 'phase3', title: '3️⃣ 콘텐츠 생성', label: 'Generation' }
            ],
            phase1: {
                title: "Data Collection & Preprocessing",
                subtitle: "부산대의 발자취를 데이터로 변환합니다.",
                desc: "역사적 사실(Fact)과 시대별 생활상(Vibe)을 담은 데이터를 수집하고, AI 학습에 최적화된 형태로 정제합니다.",
                sources: [
                    { name: "기록관/도서관", desc: "옛 학보, 졸업앨범, 건학 이념 자료 아카이빙", icon: "📚", color: "text-blue-500", bg: "bg-blue-50 dark:bg-blue-900/20" },
                    { name: "커뮤니티 & SNS", desc: "에브리타임, 인스타그램 등 학생들의 생생한 반응", icon: "📱", color: "text-pink-500", bg: "bg-pink-50 dark:bg-pink-900/20" },
                    { name: "뉴스 아카이브", desc: "민주화 운동 및 주요 사건 기사 데이터베이스", icon: "🗞️", color: "text-emerald-500", bg: "bg-emerald-50 dark:bg-emerald-900/20" }
                ],
                steps: [
                    { name: "Cleaning", nameKo: "노이즈 정제", desc: "오래된 문서의 노이즈 제거 및 OCR 디지털화" },
                    { name: "Normalization", nameKo: "언어 정규화", desc: "시대별 사투리 및 은어 표준화 매핑" },
                    { name: "Structuring", nameKo: "데이터 구조화", desc: "연도별/사건별 타임라인 데이터셋 구축" }
                ]
            },
            phase2: {
                title: "Zeitgeist Analysis",
                subtitle: "데이터에서 효원의 시대정신을 추출합니다.",
                desc: "수집된 텍스트 마이닝을 통해 부산대만의 고유한 정서(효원 정신)와 대중이 반응하는 시대적 코드를 찾아냅니다.",
                keywords: [
                    { word: "80년대 대동제", sentiment: [80, 10, 10], desc: "🔥 뜨거웠던 청춘과 민주화의 열기" },
                    { word: "미리내의 전설", sentiment: [90, 5, 5], desc: "👫 캠퍼스 커플과 넉넉한 터의 낭만" },
                    { word: "도서관의 새벽", sentiment: [70, 20, 10], desc: "🎓 시대를 불문한 치열한 학구열" }
                ],
                persona: {
                    labels: ['애교심', '역사 인식', '트렌드', '공감 능력', '창의성'],
                    data: [95, 85, 90, 80, 75],
                    desc: "🦅 부산대의 역사와 전통을 '뉴트로(Newtro)' 감각으로 재해석하는 20대 크리에이터 페르소나"
                }
            },
            phase3: {
                title: "AI Content Generation",
                subtitle: "Google AI Studio로 과거를 되살립니다.",
                desc: "분석된 '시대상'을 프롬프트에 녹여, 과거와 현재가 공존하는 독창적인 웹툰과 숏츠를 생성합니다.",
                commonSteps: [
                    { title: "페르소나 설정", text: "너는 1946년부터 부산대를 지켜본 '산신령' 작가야." },
                    { title: "컨텍스트 주입", text: "부산대 70년사 데이터 및 주요 사건 연표 입력" }
                ],
                tracks: {
                    webtoon: {
                        title: "시대극 웹툰 트랙",
                        steps: [
                            { step: "Scenario Generation", detail: "Gemini 1.5 Pro를 활용해 1980년대 장전동 캠퍼스 배경의 청춘 드라마 시나리오 작성" },
                            { step: "Image Synthesis", detail: "Imagen 3 모델로 빛바랜 필름 사진 스타일의 구정문/무지개문 복원 이미지 생성" },
                            { step: "Editing", detail: "사투리 대사('밥 묵었나?') 삽입 및 레트로 말풍선 편집" }
                        ]
                    },
                    shorts: {
                        title: "타임랩스 숏츠 트랙",
                        steps: [
                            { step: "Scripting", detail: "'그때 그 시절, 우리들의 넉터' 감성 나레이션 스크립트 작성" },
                            { step: "Video Generation", detail: "흑백 졸업사진을 움직이는 영상으로 변환 (Image-to-Video)" },
                            { step: "Audio Synthesis", detail: "통기타 BGM 및 부산 사투리 AI 보이스(TTS) 합성" }
                        ]
                    }
                }
            }
        };

        const app = {
            currentPhase: 'overview',
            charts: {},
            isDark: false,

            init: function() {
                this.initTheme();
                this.renderNav();
                this.renderContent(this.currentPhase);
            },

            initTheme: function() {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    this.setDark(true);
                } else {
                    this.setDark(false);
                }
            },

            setDark: function(isDark) {
                this.isDark = isDark;
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                }
                this.renderNav(); // Update nav styles if needed
                // If chart exists, update it
                if(this.charts.sentiment || this.charts.cleaning || this.charts.persona) {
                     this.renderContent(this.currentPhase);
                }
            },

            toggleTheme: function() {
                this.setDark(!this.isDark);
            },

            reset: function() {
                this.currentPhase = 'overview';
                this.renderNav();
                this.renderContent('overview');
            },

            getChartColor: function() {
                return this.isDark ? '#cbd5e1' : '#475569'; // slate-300 : slate-600
            },

            getChartGridColor: function() {
                return this.isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
            },

            renderNav: function() {
                const navContainer = document.getElementById('nav-container');
                navContainer.innerHTML = appData.phases.map(phase => {
                    const isActive = this.currentPhase === phase.id;
                    const activeClass = isActive
                        ? "bg-indigo-600 text-white shadow-md transform scale-[1.02]"
                        : "text-slate-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700/50";

                    return `
                    <button
                        onclick="app.changePhase('${phase.id}')"
                        class="flex-1 py-3 px-4 rounded-xl text-sm font-bold transition-all duration-300 ${activeClass}"
                    >
                        ${phase.title}
                    </button>
                    `;
                }).join('');
            },

            changePhase: function(phaseId) {
                this.currentPhase = phaseId;
                this.renderNav();
                this.renderContent(phaseId);
            },

            renderContent: function(phaseId) {
                const main = document.getElementById('main-content');
                // Destroy existing charts
                Object.values(this.charts).forEach(chart => { if(chart) chart.destroy(); });
                this.charts = {};

                main.innerHTML = ''; // Clear
                main.classList.remove('fade-in');
                void main.offsetWidth; // Trigger reflow
                main.classList.add('fade-in');

                switch(phaseId) {
                    case 'overview': this.renderOverview(main); break;
                    case 'phase1': this.renderPhase1(main); break;
                    case 'phase2': this.renderPhase2(main); break;
                    case 'phase3': this.renderPhase3(main); break;
                }
            },

            // --- Render: Overview ---
            renderOverview: function(container) {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
                        <div onclick="app.changePhase('phase1')" class="pnu-card p-8 cursor-pointer group relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity dark:invert">
                                <span class="text-6xl">📚</span>
                            </div>
                            <div class="relative z-10">
                                <div class="w-12 h-12 rounded-2xl bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-6 text-2xl shadow-inner">1</div>
                                <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-2 group-hover:text-blue-600 transition-colors">Data Collection</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400">기록관과 아카이브에서<br>시대의 조각 수집</p>
                            </div>
                        </div>

                        <div onclick="app.changePhase('phase2')" class="pnu-card p-8 cursor-pointer group relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity dark:invert">
                                <span class="text-6xl">🧠</span>
                            </div>
                            <div class="relative z-10">
                                <div class="w-12 h-12 rounded-2xl bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-400 flex items-center justify-center mb-6 text-2xl shadow-inner">2</div>
                                <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-2 group-hover:text-purple-600 transition-colors">Insight Analysis</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400">민주화, 낭만, 학구열 등<br>관통하는 키워드 추출</p>
                            </div>
                        </div>

                        <div onclick="app.changePhase('phase3')" class="pnu-card p-8 cursor-pointer group relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity dark:invert">
                                <span class="text-6xl">🎨</span>
                            </div>
                            <div class="relative z-10">
                                <div class="w-12 h-12 rounded-2xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mb-6 text-2xl shadow-inner">3</div>
                                <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-2 group-hover:text-indigo-600 transition-colors">AI Generation</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Gemini와 Imagen으로<br>그 시절을 생생하게 복원</p>
                            </div>
                        </div>
                    </div>

                    <div class="pnu-card p-8 md:p-12">
                        <div class="text-center mb-10">
                            <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-4">서비스 결과물 미리보기</h3>
                            <p class="text-slate-500 dark:text-slate-400">사용자의 선택에 따라 생성되는 실제 UI 화면입니다.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${this.renderGalleryItem('Step 01', '서비스 홈화면', 'img/step1.png')}
                            ${this.renderGalleryItem('Step 02', '사용자 얼굴 삽입', 'img/step2.png')}
                            ${this.renderGalleryItem('Step 03', '시대상 선택', 'img/step3.png')}
                            ${this.renderGalleryItem('Step 04', '이미지 생성', 'img/step4.png')}
                            ${this.renderGalleryItem('Step 05', '웹툰 생성', 'img/step5.png')}
                            ${this.renderGalleryItem('Step 06', '숏츠 생성', 'img/step6.png')}
                        </div>
                    </div>
                `;
            },

            renderGalleryItem: function(step, title, imgPath) {
                return `
                    <div class="group rounded-2xl overflow-hidden border border-gray-100 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                        <div class="aspect-video bg-gray-200 dark:bg-slate-700 relative overflow-hidden">
                             <img src="${imgPath}" alt="${title}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700" onerror="this.src='https://placehold.co/600x400/1f2937/FFFFFF?text=${title}'">
                             <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>
                        </div>
                        <div class="p-4">
                            <div class="text-[10px] font-bold text-indigo-500 dark:text-indigo-400 uppercase tracking-widest mb-1">${step}</div>
                            <h4 class="font-bold text-slate-900 dark:text-white">${title}</h4>
                        </div>
                    </div>
                `;
            },

            // --- Render: Phase 1 ---
            renderPhase1: function(container) {
                const data = appData.phase1;
                const chartColor = this.getChartColor();
                const gridColor = this.getChartGridColor();

                container.innerHTML = `
                    <div class="mb-12 text-center md:text-left">
                        <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-2">${data.title}</h2>
                        <h3 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">${data.subtitle}</h3>
                        <p class="text-slate-600 dark:text-slate-300 max-w-3xl leading-relaxed">${data.desc}</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
                        ${data.sources.map(src => `
                            <div class="pnu-card p-6 flex flex-col items-start hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                <div class="w-12 h-12 rounded-2xl ${src.bg} ${src.color} flex items-center justify-center text-2xl mb-4 shadow-sm">
                                    ${src.icon}
                                </div>
                                <h4 class="text-lg font-black text-slate-900 dark:text-white mb-2">${src.name}</h4>
                                <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">${src.desc}</p>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="pnu-card p-8">
                            <h3 class="text-xl font-black text-slate-900 dark:text-white mb-6">Preprocessing Pipeline</h3>
                            <div class="space-y-6">
                                ${data.steps.map((step, idx) => `
                                    <div class="flex items-start">
                                        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold text-sm mr-4 mt-1">
                                            ${idx + 1}
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-slate-800 dark:text-slate-200">${step.name} <span class="text-xs text-slate-400 ml-1 font-normal">(${step.nameKo})</span></h4>
                                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${step.desc}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="pnu-card p-8 flex flex-col">
                            <h3 class="text-xl font-black text-slate-900 dark:text-white mb-2">Noise Reduction</h3>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">데이터 정제를 통한 학습 품질 향상</p>
                            <div class="chart-container flex-grow">
                                <canvas id="cleaningChart"></canvas>
                            </div>
                        </div>
                    </div>
                `;

                // Render Chart
                setTimeout(() => {
                    const ctx = document.getElementById('cleaningChart').getContext('2d');
                    this.charts.cleaning = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Raw Data', 'Cleaned Data'],
                            datasets: [{
                                label: 'Documents Count',
                                data: [10000, 4500],
                                backgroundColor: [this.isDark ? '#334155' : '#e2e8f0', '#4f46e5'],
                                borderRadius: 8,
                                barThickness: 40
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: gridColor, drawBorder: false },
                                    ticks: { color: chartColor, font: {family: "'Noto Sans KR', sans-serif"} }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: chartColor, font: {family: "'Noto Sans KR', sans-serif", weight: 'bold'} }
                                }
                            }
                        }
                    });
                }, 100);
            },

            // --- Render: Phase 2 ---
            renderPhase2: function(container) {
                const data = appData.phase2;
                const chartColor = this.getChartColor();
                const gridColor = this.getChartGridColor();

                container.innerHTML = `
                    <div class="mb-12 text-center md:text-left">
                        <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-2">${data.title}</h2>
                        <h3 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">${data.subtitle}</h3>
                        <p class="text-slate-600 dark:text-slate-300 max-w-3xl leading-relaxed">${data.desc}</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="pnu-card p-8">
                            <h3 class="text-xl font-black text-slate-900 dark:text-white mb-6">Keyword Sentiment</h3>
                            <div class="flex flex-wrap gap-2 mb-8">
                                ${data.keywords.map((kw, idx) => `
                                    <button onclick="app.updateSentiment(${idx})" id="kw-btn-${idx}"
                                        class="px-4 py-2 rounded-full text-sm font-bold transition-all border border-transparent hover:border-indigo-200 dark:hover:border-indigo-800 ${idx===0 ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}">
                                        #${kw.word}
                                    </button>
                                `).join('')}
                            </div>

                            <div id="keyword-desc" class="mb-6 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-900/20 text-indigo-800 dark:text-indigo-200 text-sm font-medium flex items-center">
                                <span class="text-xl mr-3">💡</span>
                                ${data.keywords[0].desc}
                            </div>

                            <div class="chart-container" style="height: 250px;">
                                <canvas id="sentimentChart"></canvas>
                            </div>
                        </div>

                        <div class="pnu-card p-8">
                            <h3 class="text-xl font-black text-slate-900 dark:text-white mb-2">Target Persona</h3>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">${data.persona.desc}</p>
                            <div class="chart-container">
                                <canvas id="personaChart"></canvas>
                            </div>
                        </div>
                    </div>
                `;

                setTimeout(() => {
                    // Sentiment Chart
                    const sentCtx = document.getElementById('sentimentChart').getContext('2d');
                    this.charts.sentiment = new Chart(sentCtx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Positive', 'Negative', 'Neutral'],
                            datasets: [{
                                data: data.keywords[0].sentiment,
                                backgroundColor: ['#10b981', '#ef4444', '#94a3b8'],
                                borderWidth: 0,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'right', labels: { color: chartColor, font: {family: "'Noto Sans KR', sans-serif"} } }
                            },
                            cutout: '70%'
                        }
                    });

                    // Persona Chart
                    const perCtx = document.getElementById('personaChart').getContext('2d');
                    this.charts.persona = new Chart(perCtx, {
                        type: 'radar',
                        data: {
                            labels: data.persona.labels,
                            datasets: [{
                                label: 'Persona Score',
                                data: data.persona.data,
                                fill: true,
                                backgroundColor: 'rgba(79, 70, 229, 0.2)',
                                borderColor: '#4f46e5',
                                pointBackgroundColor: '#4f46e5',
                                pointBorderColor: '#fff',
                                pointHoverBackgroundColor: '#fff',
                                pointHoverBorderColor: '#4f46e5'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    angleLines: { color: gridColor },
                                    grid: { color: gridColor },
                                    pointLabels: { color: chartColor, font: {size: 11, weight: 'bold', family: "'Noto Sans KR', sans-serif"} },
                                    ticks: { display: false, backdropColor: 'transparent' },
                                    suggestedMin: 0,
                                    suggestedMax: 100
                                }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                }, 100);
            },

            updateSentiment: function(index) {
                const kw = appData.phase2.keywords[index];

                // Toggle Button Styles
                document.querySelectorAll('[id^="kw-btn-"]').forEach((btn, idx) => {
                    if(idx === index) {
                        btn.className = "px-4 py-2 rounded-full text-sm font-bold transition-all border border-transparent bg-indigo-600 text-white shadow-md transform scale-105";
                    } else {
                        btn.className = "px-4 py-2 rounded-full text-sm font-bold transition-all border border-transparent hover:border-indigo-200 dark:hover:border-indigo-800 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400";
                    }
                });

                document.getElementById('keyword-desc').innerHTML = `<span class="text-xl mr-3">💡</span>${kw.desc}`;

                this.charts.sentiment.data.datasets[0].data = kw.sentiment;
                this.charts.sentiment.update();
            },

            // --- Render: Phase 3 ---
            renderPhase3: function(container) {
                const data = appData.phase3;
                container.innerHTML = `
                    <div class="mb-12 text-center md:text-left">
                        <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-2">${data.title}</h2>
                        <h3 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">${data.subtitle}</h3>
                        <p class="text-slate-600 dark:text-slate-300 max-w-3xl leading-relaxed mb-8">${data.desc}</p>

                        <div class="inline-flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                            <button onclick="app.toggleTrack('webtoon')" id="track-btn-webtoon" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all shadow-sm bg-white dark:bg-slate-700 text-indigo-600 dark:text-white">Webtoon</button>
                            <button onclick="app.toggleTrack('shorts')" id="track-btn-shorts" class="px-6 py-2.5 rounded-lg text-sm font-bold transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900">Shorts</button>
                        </div>
                    </div>

                    <div class="pnu-card p-0 overflow-hidden flex flex-col md:flex-row min-h-[500px]">
                        <div class="w-full md:w-2/5 bg-slate-50 dark:bg-slate-800/50 p-8 border-b md:border-b-0 md:border-r border-slate-100 dark:border-slate-700">
                             <div class="mb-8">
                                <span class="text-xs font-black text-indigo-500 dark:text-indigo-400 uppercase tracking-widest mb-2 block">System Prompt</span>
                                <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                    <div class="flex items-center gap-2 mb-2 pb-2 border-b border-dashed border-slate-200 dark:border-slate-700">
                                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                                        <span class="text-xs font-bold text-slate-500">Context Injection</span>
                                    </div>
                                    <p class="text-sm text-slate-700 dark:text-slate-300 font-mono leading-relaxed">
                                        "You are a historical creator analyzing 70 years of PNU history..."
                                    </p>
                                </div>
                            </div>

                            <div>
                                <span class="text-xs font-black text-indigo-500 dark:text-indigo-400 uppercase tracking-widest mb-3 block">Common Setup</span>
                                <ul class="space-y-3">
                                    ${data.commonSteps.map(step => `
                                        <li class="flex items-center text-sm text-slate-700 dark:text-slate-300">
                                            <span class="w-5 h-5 rounded-full bg-indigo-100 dark:bg-indigo-900 text-indigo-600 flex items-center justify-center text-xs mr-3">✓</span>
                                            ${step.title}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="w-full md:w-3/5 p-8 md:p-12" id="track-content">
                            </div>
                    </div>
                `;
                this.toggleTrack('webtoon');
            },

            toggleTrack: function(trackName) {
                const btnWebtoon = document.getElementById('track-btn-webtoon');
                const btnShorts = document.getElementById('track-btn-shorts');
                const contentDiv = document.getElementById('track-content');
                const trackData = appData.phase3.tracks[trackName];

                // Update Buttons
                const activeClasses = "bg-white dark:bg-slate-700 text-indigo-600 dark:text-white shadow-sm";
                const inactiveClasses = "text-slate-500 dark:text-slate-400 hover:text-slate-900";

                if(trackName === 'webtoon') {
                    btnWebtoon.className = `px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${activeClasses}`;
                    btnShorts.className = `px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${inactiveClasses}`;
                } else {
                    btnWebtoon.className = `px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${inactiveClasses}`;
                    btnShorts.className = `px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${activeClasses}`;
                }

                // Render Content
                contentDiv.innerHTML = `
                    <div class="h-full flex flex-col fade-in">
                        <div class="flex items-center justify-between mb-8">
                            <h3 class="text-3xl font-black text-slate-900 dark:text-white">${trackData.title}</h3>
                            <div class="px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded-lg">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-300 uppercase">Workflow</span>
                            </div>
                        </div>

                        <div class="space-y-8 relative">
                            <div class="absolute left-[15px] top-4 bottom-4 w-0.5 bg-slate-200 dark:bg-slate-700"></div>

                            ${trackData.steps.map((step, idx) => `
                                <div class="relative pl-12">
                                    <div class="absolute left-0 top-1 w-8 h-8 rounded-full border-4 border-white dark:border-slate-800 ${trackName === 'webtoon' ? 'bg-indigo-500' : 'bg-purple-500'} flex items-center justify-center z-10 shadow-sm">
                                        <span class="text-[10px] text-white font-bold">${idx + 1}</span>
                                    </div>
                                    <h4 class="text-lg font-bold text-slate-900 dark:text-white mb-1">${step.step}</h4>
                                    <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">${step.detail}</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-auto pt-8">
                             <button class="w-full py-4 rounded-xl bg-slate-900 dark:bg-indigo-600 text-white font-bold text-lg hover:bg-slate-800 dark:hover:bg-indigo-500 transition-all shadow-lg hover:shadow-xl hover:-translate-y-1">
                                Start Generation Process
                            </button>
                        </div>
                    </div>
                `;
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
